<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FleetHub Mothership</title>

    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --glass-bg: rgba(8, 20, 40, 0.55);
            --glass-border: rgba(100, 200, 255, 0.15);
            --glass-glow: rgba(0, 180, 255, 0.08);
            --cyan: #00d4ff;
            --cyan-dim: rgba(0, 180, 255, 0.3);
            --text-primary: #e8f4ff;
            --text-dim: rgba(180, 220, 255, 0.6);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050a14;
            font-family: var(--font);
            color: var(--text-primary);
            user-select: none;
        }

        /* ----- canvas container ----- */
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* ----- glass overlay ----- */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(18px) saturate(1.2);
            -webkit-backdrop-filter: blur(18px) saturate(1.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), inset 0 0 60px var(--glass-glow);
        }

        /* ----- UI overlay ----- */
        #ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 28px 34px 32px 34px;
        }
        #ui-overlay>* {
            pointer-events: auto;
        }

        /* top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .brand .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, var(--cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 180, 255, 0.2);
        }
        .brand .sub {
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .status-group {
            display: flex;
            gap: 28px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 22px;
            border-radius: 40px;
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 30px var(--glass-glow);
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: var(--text-dim);
        }
        .status-item .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2.4s ease-in-out infinite;
        }
        .status-item .dot.green {
            background: #00ff88;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
        }
        .status-item .dot.cyan {
            background: var(--cyan);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
        }
        .status-item .dot.orange {
            background: #ffaa44;
            box-shadow: 0 0 12px rgba(255, 170, 68, 0.4);
            animation-delay: 0.6s;
        }
        .status-item .label {
            text-transform: uppercase;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 1.5px;
        }
        .status-item .value {
            color: #fff;
            font-weight: 500;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.35;
                transform: scale(0.8);
            }
        }

        /* ----- center crosshair / reference ----- */
        .center-ref {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0.15;
        }
        .center-ref .ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 1px solid rgba(0, 212, 255, 0.2);
            position: relative;
        }
        .center-ref .ring::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.25);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        }
        .center-ref .cross-h,
        .center-ref .cross-v {
            position: absolute;
            background: rgba(0, 212, 255, 0.12);
        }
        .center-ref .cross-h {
            width: 60px;
            height: 1px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .center-ref .cross-v {
            width: 1px;
            height: 60px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* ----- bottom controls ----- */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }

        .control-panel {
            display: flex;
            gap: 28px;
            padding: 14px 28px;
            border-radius: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            box-shadow: inset 0 0 40px var(--glass-glow);
        }
        .ctrl-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 9px;
            font-weight: 400;
            letter-spacing: 1.2px;
            color: var(--text-dim);
            text-transform: uppercase;
            cursor: default;
            transition: opacity 0.3s;
        }
        .ctrl-item .icon {
            font-size: 18px;
            opacity: 0.7;
            transition: opacity 0.3s, transform 0.3s;
        }
        .ctrl-item.active .icon {
            opacity: 1;
            transform: scale(1.05);
        }
        .ctrl-item.active .label {
            color: var(--cyan);
        }
        .ctrl-item .label {
            transition: color 0.3s;
        }
        .ctrl-item .value {
            font-size: 10px;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .time-display {
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-dim);
            padding: 10px 22px;
            border-radius: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            text-align: right;
            line-height: 1.4;
        }
        .time-display .main {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            letter-spacing: 3px;
        }
        .time-display .tz {
            font-size: 9px;
            letter-spacing: 2px;
            opacity: 0.5;
        }

        /* ----- scan line effect (subtle) ----- */
        .scan-line {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 180, 255, 0.012) 2px,
                    rgba(0, 180, 255, 0.012) 4px);
            opacity: 0.5;
        }

        /* ----- vignette ----- */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(2, 6, 16, 0.7) 100%);
        }

        /* ----- responsive ----- */
        @media (max-width: 820px) {
            #ui-overlay {
                padding: 18px 20px 22px 20px;
            }
            .status-group {
                gap: 12px;
                padding: 6px 14px;
                flex-wrap: wrap;
            }
            .status-item {
                font-size: 9px;
            }
            .control-panel {
                gap: 14px;
                padding: 10px 16px;
                flex-wrap: wrap;
            }
            .brand .logo {
                font-size: 16px;
            }
            .time-display .main {
                font-size: 14px;
            }
            .center-ref .ring {
                width: 70px;
                height: 70px;
            }
            .center-ref .cross-h {
                width: 34px;
            }
            .center-ref .cross-v {
                height: 34px;
            }
        }

        @media (max-width: 500px) {
            .top-bar {
                flex-direction: column;
                gap: 10px;
            }
            .status-group {
                width: 100%;
                justify-content: space-between;
            }
            .bottom-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .control-panel {
                justify-content: space-around;
            }
            .time-display {
                text-align: center;
            }
        }

        /* ----- loading / fallback ----- */
        .loading-msg {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050a14;
            color: var(--text-dim);
            font-size: 13px;
            letter-spacing: 3px;
            transition: opacity 1.2s ease;
        }
        .loading-msg.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-msg .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(0, 212, 255, 0.1);
            border-top-color: var(--cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- loading -->
    <div class="loading-msg" id="loading">
        <div class="spinner"></div>
        <span>INITIALIZING OBSERVATION DECK</span>
    </div>

    <!-- vignette & scan -->
    <div class="vignette"></div>
    <div class="scan-line"></div>

    <!-- Three.js container -->
    <div id="canvas-container"></div>

    <!-- center reference -->
    <div class="center-ref" aria-hidden="true">
        <div class="ring">
            <div class="cross-h"></div>
            <div class="cross-v"></div>
        </div>
    </div>

    <!-- UI overlay -->
    <div id="ui-overlay">

        <!-- top -->
        <div class="top-bar">
            <div class="brand">
                <div class="logo">✦ FLEETHUB MOTHERSHIP</div>
                <div class="sub">Observation Deck · Command Link Active</div>
            </div>
            <div class="status-group">
                <div class="status-item">
                    <span class="dot green"></span>
                    <span class="label">System</span>
                    <span class="value">Online</span>
                </div>
                <div class="status-item">
                    <span class="dot cyan"></span>
                    <span class="label">Link</span>
                    <span class="value">Stable</span>
                </div>
                <div class="status-item">
                    <span class="dot orange"></span>
                    <span class="label">Earth</span>
                    <span class="value">Locked</span>
                </div>
            </div>
        </div>

        <!-- bottom -->
        <div class="bottom-bar">
            <div class="control-panel">
                <div class="ctrl-item active">
                    <span class="icon">◉</span>
                    <span class="label">View</span>
                    <span class="value">Global</span>
                </div>
                <div class="ctrl-item">
                    <span class="icon">⟳</span>
                    <span class="label">Rotation</span>
                    <span class="value">0.42×</span>
                </div>
                <div class="ctrl-item">
                    <span class="icon">⊹</span>
                    <span class="label">Atmo</span>
                    <span class="value">Active</span>
                </div>
                <div class="ctrl-item">
                    <span class="icon">⏚</span>
                    <span class="label">Grid</span>
                    <span class="value">On</span>
                </div>
            </div>
            <div class="time-display">
                <div class="main" id="clock">--:--:--</div>
                <div class="tz">UTC · EARTH STANDARD</div>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ----- clock -----
        function updateClock() {
            const now = new Date();
            const h = String(now.getUTCHours()).padStart(2, '0');
            const m = String(now.getUTCMinutes()).padStart(2, '0');
            const s = String(now.getUTCSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}:${s}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ----- Three.js setup -----
        const container = document.getElementById('canvas-container');
        const width = window.innerWidth;
        const height = window.innerHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050a14);

        const camera = new THREE.PerspectiveCamera(32, width / height, 0.1, 1000);
        camera.position.set(0, 0.8, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance",
        });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // ----- texture loader with fallback -----
        const loader = new THREE.TextureLoader();
        const textureBase = 'https://threejs.org/examples/textures/planets/';

        // ----- Earth -----
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        const EARTH_RADIUS = 3.8;
        const earthGeo = new THREE.SphereGeometry(EARTH_RADIUS, 96, 96);

        // load textures
        const texMap = loader.load(textureBase + 'earth_atmos_2048.jpg');
        const texBump = loader.load(textureBase + 'earth_normal_2048.jpg');
        const texSpec = loader.load(textureBase + 'earth_specular_2048.jpg');
        const texClouds = loader.load(textureBase + 'earth_clouds_1024.png');

        const earthMat = new THREE.MeshPhongMaterial({
            map: texMap,
            bumpMap: texBump,
            bumpScale: 0.04,
            specularMap: texSpec,
            specular: new THREE.Color(0x333333),
            shininess: 5,
            emissive: new THREE.Color(0x001122),
            emissiveIntensity: 0.06,
        });
        const earth = new THREE.Mesh(earthGeo, earthMat);
        earthGroup.add(earth);

        // ----- clouds (transparent layer) -----
        const cloudGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.012, 80, 80);
        const cloudMat = new THREE.MeshPhongMaterial({
            map: texClouds,
            transparent: true,
            opacity: 0.35,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide,
        });
        const clouds = new THREE.Mesh(cloudGeo, cloudMat);
        earthGroup.add(clouds);

        // ----- atmosphere glow (custom sprite) -----
        function createGlowTexture() {
            const size = 256;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const center = size / 2;
            const gradient = ctx.createRadialGradient(center, center, 0, center, center, center);
            gradient.addColorStop(0, 'rgba(80, 200, 255, 0.0)');
            gradient.addColorStop(0.5, 'rgba(40, 160, 255, 0.05)');
            gradient.addColorStop(0.8, 'rgba(20, 120, 255, 0.12)');
            gradient.addColorStop(1, 'rgba(0, 60, 180, 0.0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            return new THREE.CanvasTexture(canvas);
        }

        const glowTexture = createGlowTexture();
        const glowMat = new THREE.SpriteMaterial({
            map: glowTexture,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.7,
            depthWrite: false,
        });
        const glow = new THREE.Sprite(glowMat);
        glow.scale.set(EARTH_RADIUS * 3.2, EARTH_RADIUS * 3.2, 1);
        earthGroup.add(glow);

        // ----- lighting -----
        const ambientLight = new THREE.AmbientLight(0x224466, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 2.2);
        sunLight.position.set(10, 6, 12);
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
        fillLight.position.set(-8, -2, -6);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0x88ddff, 0.6);
        rimLight.position.set(-4, 8, -10);
        scene.add(rimLight);

        // subtle backlight
        const backLight = new THREE.DirectionalLight(0x0066aa, 0.3);
        backLight.position.set(0, -2, -12);
        scene.add(backLight);

        // ----- starfield -----
        function createStars() {
            const count = 12000;
            const positions = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const radius = 60 + Math.random() * 180;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = radius * Math.cos(phi);

                sizes[i] = 0.15 + Math.random() * 0.55;

                const temp = 0.7 + Math.random() * 0.3;
                colors[i * 3] = 0.9 + Math.random() * 0.1;
                colors[i * 3 + 1] = 0.85 + Math.random() * 0.15;
                colors[i * 3 + 2] = 0.8 + Math.random() * 0.2;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 0.12,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            const stars = new THREE.Points(geo, mat);
            scene.add(stars);
            return stars;
        }
        const starField = createStars();

        // ----- extra distant stars (tiny, numerous) -----
        function createDistantStars() {
            const count = 25000;
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const radius = 200 + Math.random() * 400;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = radius * Math.cos(phi);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: 0x88bbff,
                size: 0.04,
                transparent: true,
                opacity: 0.5,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });
            const stars = new THREE.Points(geo, mat);
            scene.add(stars);
            return stars;
        }
        const distantStars = createDistantStars();

        // ----- orbital ring (subtle) -----
        function createOrbitalRing() {
            const segments = 200;
            const radius = EARTH_RADIUS * 1.65;
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                const x = radius * Math.cos(theta);
                const z = radius * Math.sin(theta);
                const y = Math.sin(theta * 3) * 0.08;
                points.push(new THREE.Vector3(x, y, z));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({
                color: 0x3366aa,
                transparent: true,
                opacity: 0.15,
                blending: THREE.AdditiveBlending,
            });
            const ring = new THREE.Line(geo, mat);
            earthGroup.add(ring);

            // second ring tilted
            const points2 = [];
            const tilt = 0.3;
            for (let i = 0; i <= segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                const r = radius * 1.08;
                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta) * Math.cos(tilt);
                const y = r * Math.sin(theta) * Math.sin(tilt);
                points2.push(new THREE.Vector3(x, y, z));
            }
            const geo2 = new THREE.BufferGeometry().setFromPoints(points2);
            const mat2 = new THREE.LineBasicMaterial({
                color: 0x44aaff,
                transparent: true,
                opacity: 0.06,
                blending: THREE.AdditiveBlending,
            });
            const ring2 = new THREE.Line(geo2, mat2);
            earthGroup.add(ring2);

            return [ring, ring2];
        }
        const rings = createOrbitalRing();

        // ----- floating particles (micro) around Earth -----
        function createMicroParticles() {
            const count = 800;
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const r = EARTH_RADIUS * (1.2 + Math.random() * 0.8);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: 0x88ddff,
                size: 0.015,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });
            const pts = new THREE.Points(geo, mat);
            earthGroup.add(pts);
            return pts;
        }
        const microParticles = createMicroParticles();

        // ----- subtle lens flare (fake with sprite) -----
        function createFlare() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(100, 200, 255, 0.06)');
            grad.addColorStop(0.3, 'rgba(60, 160, 255, 0.03)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({
                map: tex,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false,
                opacity: 0.6,
            });
            const sprite = new THREE.Sprite(mat);
            sprite.position.set(4, 2.5, 6);
            sprite.scale.set(14, 14, 1);
            scene.add(sprite);
            return sprite;
        }
        const flare = createFlare();

        // ----- animation loop -----
        let clock = new THREE.Clock();

        function animate() {
            const delta = clock.getDelta();
            const elapsed = performance.now() / 1000;

            // rotate earth & clouds
            earth.rotation.y += delta * 0.10;
            clouds.rotation.y += delta * 0.14;

            // subtle wobble on earth group
            earthGroup.rotation.z = Math.sin(elapsed * 0.015) * 0.008;
            earthGroup.rotation.x = Math.sin(elapsed * 0.012 + 0.5) * 0.005;

            // rotate rings
            rings.forEach((r, i) => {
                r.rotation.y += delta * (0.02 + i * 0.01);
            });

            // micro particles drift
            microParticles.rotation.y += delta * 0.015;
            microParticles.rotation.x = Math.sin(elapsed * 0.008) * 0.02;

            // star field slow rotation
            starField.rotation.y += delta * 0.0012;
            starField.rotation.x = Math.sin(elapsed * 0.0003) * 0.01;
            distantStars.rotation.y += delta * 0.0006;
            distantStars.rotation.x = Math.sin(elapsed * 0.0002 + 0.3) * 0.005;

            // glow pulse
            const pulse = 0.65 + Math.sin(elapsed * 0.3) * 0.1;
            glowMat.opacity = pulse;

            // camera subtle drift
            const cx = Math.sin(elapsed * 0.008) * 0.3;
            const cy = 0.8 + Math.sin(elapsed * 0.01 + 0.7) * 0.15;
            camera.position.x = cx;
            camera.position.y = cy;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // ----- resize -----
        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);

        // ----- hide loading -----
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
        }, 800);

        // ----- start -----
        animate();

        // ----- graceful error handling for textures -----
        console.log('✦ FleetHub Mothership · Observation Deck active');
    </script>
</body>
</html>
